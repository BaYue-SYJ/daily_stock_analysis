version: "3.9"
services:
  api:
    build: .
    container_name: ai-news-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: ai_news_saas
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - mysql
      - redis

  worker:
    build: .
    container_name: ai-news-worker
    command: celery -A app.tasks.celery_app.celery_app worker -Q content_pipeline -l info
    volumes:
      - ./:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: ai_news_saas
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - mysql
      - redis

  redis:
    image: redis:7-alpine
    container_name: ai-news-redis
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: ai-news-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_news_saas
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
